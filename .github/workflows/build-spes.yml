name: Build spes (BakaSU + SUSFS)

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub release (otherwise only a workflow artifact)'
        type: boolean
        required: false
        default: false
      susfs_patch_url:
        description: 'SUSFS 4.19 patch URL override (empty = latest upstream mirror)'
        required: false
        default: ''
  push:
    branches: [bka]
    paths: ['.github/workflows/build-spes.yml']
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: write

env:
  ARCH: arm64
  DEVICE: spes
  DEFCONFIG: vendor/spes-perf_defconfig
  KSU_SETUP_URL: https://raw.githubusercontent.com/Baka-SU/BakaSU/refs/heads/main/kernel/setup.sh
  KSU_BRANCH: main
  SUSFS_PATCH_URL: https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/Patch/susfs_patch_to_4.19.patch
  CLANG_URL: https://github.com/kdrag0n/proton-clang.git
  HOOKS_URL: https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/susfs_inline_hook_patches.sh
  CHIP: khaje
  NOMOUNT_SETUP_URL: https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh
  SUSFS_MIN_VERSION: 2.3.00
  SUSFS_PATCH_OVERRIDE: ${{ inputs.susfs_patch_url }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl bc bison flex libssl-dev libelf-dev device-tree-compiler \
            zip unzip cpio python3 lz4 zstd ccache \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clang
        run: |
          git clone --depth=1 "$CLANG_URL" "$HOME/clang"
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"

      - name: KernelSU (floating)
        run: |
          curl -sSL "$KSU_SETUP_URL" | bash -s "$KSU_BRANCH"
          echo "KSU_VER=$(git -C KernelSU rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: SUSFS (floating)
        run: |
          url="${SUSFS_PATCH_OVERRIDE:-$SUSFS_PATCH_URL}"
          curl -fsSL "$url" -o /tmp/susfs.patch
          ver=$(sed -n 's/^+#define SUSFS_VERSION "v\([0-9.]*\)".*/\1/p' /tmp/susfs.patch | head -1)
          echo "SUSFS $ver from $url"
          [ -n "$ver" ] || { echo "::error::SUSFS_VERSION not found in patch"; exit 1; }
          [ "$(printf '%s\n%s\n' "$SUSFS_MIN_VERSION" "$ver" | sort -V | head -1)" = "$SUSFS_MIN_VERSION" ] \
            || { echo "::error::SUSFS $ver is older than $SUSFS_MIN_VERSION required by BakaSU"; exit 1; }
          echo "SUSFS_VER=$ver" >> "$GITHUB_ENV"
          # the 4.19 patch predates this tree's fs_context mount API and mm backports,
          # so a few hunks reject by design and are re-applied by susfs-4.19-compat.patch
          git apply --reject /tmp/susfs.patch > /tmp/susfs-apply.log 2>&1 || true
          echo "upstream hunks rejected (expected): $(grep -c 'patch failed' /tmp/susfs-apply.log || true)"
          git apply susfs-4.19-compat.patch
          for f in fs/Makefile fs/super.c mm/memory.c fs/proc/task_mmu.c fs/namespace.c; do rm -f "$f.rej"; done
          if find . -name '*.rej' | grep -q .; then
            find . -name '*.rej' -exec sh -c 'echo "=== $1"; cat "$1"' _ {} \;
            echo "::error::SUSFS patch left rejects, fix them and rerun"
            exit 1
          fi
          echo "SUSFS applied cleanly"

      - name: KSU inline hooks (floating)
        run: |
          curl -fsSL "$HOOKS_URL" -o /tmp/hooks.sh
          bash /tmp/hooks.sh

      - name: NoMount (floating dev)
        run: |
          curl -fsSL "$NOMOUNT_SETUP_URL" | bash -s
          echo "NOMOUNT_VER=$(git -C NoMount rev-parse --short HEAD)" >> "$GITHUB_ENV"
          cfg="arch/$ARCH/configs/$DEFCONFIG"
          grep -q '^CONFIG_NOMOUNT=' "$cfg" || echo "CONFIG_NOMOUNT=y" >> "$cfg"

      - name: Defconfig
        run: |
          cfg="arch/$ARCH/configs/$DEFCONFIG"
          for c in KSU KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT \
                   KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                   KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP \
                   KSU_SUSFS_PRIORITY_UID_FILTER THREAD_INFO_IN_TASK; do
            grep -q "^CONFIG_$c=" "$cfg" || echo "CONFIG_$c=y" >> "$cfg"
          done
          tail -n 20 "$cfg"

      - name: Build
        run: |
          set -o pipefail
          M="O=out ARCH=$ARCH CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make $M "$DEFCONFIG"
          make $M -j"$(nproc)" 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Pack AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          boot="out/arch/$ARCH/boot"
          img="$boot/Image.gz-dtb"
          if [ ! -f "$img" ]; then
            gz="$boot/Image.gz"
            if [ ! -f "$gz" ]; then
              gzip -c "$boot/Image" > /tmp/Image.gz
              gz=/tmp/Image.gz
            fi
            dtb="$boot/dts/vendor/qcom/$CHIP.dtb"
            [ -f "$dtb" ] || dtb=$(find "$boot/dts" -name "$CHIP.dtb" | head -1)
            [ -f "$dtb" ] || { echo "::error::no $CHIP.dtb in build output"; exit 1; }
            cat "$gz" "$dtb" > /tmp/Image.gz-dtb
            img=/tmp/Image.gz-dtb
          fi
          ls -l "$img"
          cp "$img" ak3/
          cat > ak3/anykernel.sh <<'AK3'
          kernel.string=BakaSU + SUSFS 4.19
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=spes
          device.name2=spesn
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          AK3
          cd ak3
          zip -qr9 "../$DEVICE-KSU-SUSFS.zip" . -x '.git/*'
          cd ..
          ls -lh "$DEVICE-KSU-SUSFS.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEVICE }}-KSU-SUSFS
          path: ${{ env.DEVICE }}-KSU-SUSFS.zip

      - name: Summary
        if: always()
        run: |
          kver=$(sed -n 's/^#define UTS_RELEASE "\(.*\)"/\1/p' out/include/generated/utsrelease.h 2>/dev/null || true)
          size=$(du -h "$DEVICE-KSU-SUSFS.zip" 2>/dev/null | cut -f1 || true)
          {
            echo "### $DEVICE build"
            echo ""
            echo "- kernel: ${kver:-unknown} @ ${GITHUB_SHA::7}"
            echo "- KernelSU: BakaSU $KSU_BRANCH ${KSU_VER:-unknown}"
            echo "- SUSFS: v${SUSFS_VER:-unknown} (min $SUSFS_MIN_VERSION)"
            echo "- NoMount: dev ${NOMOUNT_VER:-unknown}"
            echo "- artifact: $DEVICE-KSU-SUSFS.zip ${size:-not built}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release
        if: inputs.release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="spes-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          gh release create "$TAG" "$DEVICE-KSU-SUSFS.zip" --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes "BakaSU $KSU_BRANCH + SUSFS 4.19 floating @ kernel ${GITHUB_SHA::7}"
